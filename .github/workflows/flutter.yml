name: Flutter checks
on:
  pull_request:
  push:
    branches: [main, feature/map-navigation]
concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test test_geocoding.dart
      - run: flutter analyze --fatal-infos
        if: success() || failure()
      - run: flutter test
        if: success() || failure()
